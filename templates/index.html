<!DOCTYPE html>
<html>
<head>
    <title>Mini Compiler</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            padding: 20px;
        }
        textarea {
            width: 100%;
            height: 150px;
            font-family: monospace;
        }
        pre {
            background: #222;
            color: #0f0;
            padding: 15px;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>
    <h2>Mini Compiler (Lexical, Syntax, Semantic)</h2>
    <form method="POST" action="/compile">
        <label>Enter your code:</label><br>
        <textarea name="code" required></textarea><br><br>
        <button type="submit">Compile</button>
    </form>

    {% if output %}
        <h3>Output</h3>
        <pre>{{ output }}</pre>
    {% endif %}
</body>
</html>
